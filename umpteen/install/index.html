<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Get Umpteen</title>
    <meta name="description" content="Umpteen: 100+ games in one small app. Every game works offline, with no sign-up. Free on iPhone, iPad and Android.">
    <meta name="theme-color" content="#2a0f5c">
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://compution.co.uk/umpteen/">
    <link rel="icon" href="/umpteen/icon.png">
    <link rel="apple-touch-icon" href="/umpteen/icon.png">
    <script>
        // The ad's link. Phones go straight on to their store, once per visit,
        // so coming back from the store leaves them on this page. Anything
        // else gets the full landing page.
        (function () {
            var ua = navigator.userAgent || '';
            // iPadOS reports itself as a Mac; a touch screen gives it away.
            var ios = /iPhone|iPad|iPod/.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var android = /Android/i.test(ua);
            if (!ios && !android) {
                location.replace('/umpteen/' + location.search);
                return;
            }
            var store = ios
                ? 'https://apps.apple.com/app/id6806872151'
                : 'https://play.google.com/store/apps/details?id=com.compution.pocketgames.pocket_games';
            // Pass any utm_ tags on to Play as the install referrer.
            var utm = location.search.slice(1).split('&').filter(function (p) {
                return /^utm_/.test(p);
            }).join('&');
            if (android && utm) store += '&referrer=' + encodeURIComponent(utm);
            window.umpteenStore = { href: store, ios: ios };
            try {
                if (sessionStorage.getItem('sent')) return;
                sessionStorage.setItem('sent', '1');
            } catch (e) {}
            location.href = store;
        })();
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Inter:wght@400;500&display=swap">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a0838;
            background-image:
                radial-gradient(ellipse 90% 60% at 50% 0%, rgba(255, 110, 200, 0.35), transparent 70%),
                linear-gradient(180deg, #2a0f5c 0%, #12062a 100%);
            background-attachment: fixed;
            color: #f3eefe;
            min-height: 100vh;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: max(32px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        }

        main {
            width: 100%;
            max-width: 360px;
        }

        .icon {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 0 3px rgba(255, 255, 255, 0.9);
        }

        h1 {
            font-family: 'Baloo 2', 'Arial Rounded MT Bold', sans-serif;
            font-weight: 800;
            font-size: 56px;
            line-height: 1;
            color: #fff;
            margin-top: 20px;
            text-shadow: 4px 5px 0 #c2357f, 0 10px 24px rgba(0, 0, 0, 0.4);
        }

        p {
            margin-top: 10px;
            font-size: 16px;
        }

        .get {
            display: block;
            margin-top: 28px;
            padding: 18px 24px 15px;
            border-radius: 18px;
            background: #ffc93c;
            color: #1b1530;
            font-family: 'Baloo 2', 'Arial Rounded MT Bold', sans-serif;
            font-weight: 800;
            font-size: 24px;
            line-height: 1;
            text-decoration: none;
            box-shadow: 0 6px 0 #b9851a, 0 14px 28px rgba(0, 0, 0, 0.35);
        }

        .more {
            display: inline-block;
            margin-top: 22px;
            font-size: 14px;
            color: #cbbbf0;
        }
    </style>
</head>
<body>
    <main>
        <img class="icon" src="/umpteen/icon.png" alt="Umpteen app icon" width="96" height="96">
        <h1>UMPTEEN</h1>
        <p>100+ games in one small app. Free download. No sign-up.</p>
        <a class="get" id="get" href="/umpteen/">Get Umpteen free</a>
        <a class="more" href="/umpteen/">See what's inside</a>
    </main>
    <script>
        // Shown when the store didn't open, or on coming back from it.
        (function () {
            var s = window.umpteenStore;
            if (!s) return;
            var get = document.getElementById('get');
            get.href = s.href;
            get.textContent = s.ios ? 'Get it on the App Store' : 'Get it on Google Play';
        })();
    </script>
</body>
</html>
